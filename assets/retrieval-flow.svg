<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" role="img" aria-labelledby="title description">
  <title>Animated NICE-RAG retrieval and citation flow</title>
  <desc>A synthetic document moves through provenance tagging, bounded retrieval, and a guideline-page citation. The animation stops and all content remains visible when reduced motion is preferred.</desc>
  <style>
    :root { color-scheme: light dark; }
    .bg { fill: #f6f8fa; stroke: #d0d7de; }
    .node { fill: #ffffff; stroke: #afb8c1; stroke-width: 1.5; }
    .label { fill: #1f2328; font: 600 15px ui-monospace, SFMono-Regular, Consolas, monospace; }
    .sub { fill: #57606a; font: 12px ui-monospace, SFMono-Regular, Consolas, monospace; }
    .wire { fill: none; stroke: #1f883d; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 12 10; animation: flow 1.5s linear 3; }
    .pulse { fill: #1f883d; animation: pulse 1.8s ease-out 3; transform-origin: center; }
    .citation { fill: #ddf4ff; stroke: #0969da; stroke-width: 2; }
    .citation-text { fill: #0550ae; font: 700 16px ui-monospace, SFMono-Regular, Consolas, monospace; }
    @keyframes flow { to { stroke-dashoffset: -44; } }
    @keyframes pulse { 0%, 100% { opacity: .35; transform: scale(.75); } 45% { opacity: 1; transform: scale(1.15); } }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #30363d; }
      .node { fill: #161b22; stroke: #484f58; }
      .label { fill: #f0f6fc; }
      .sub { fill: #8b949e; }
      .wire, .pulse { stroke: #3fb950; fill: #3fb950; }
      .citation { fill: #0c2d6b; stroke: #58a6ff; }
      .citation-text { fill: #79c0ff; }
    }
    @media (prefers-reduced-motion: reduce) {
      .wire, .pulse { animation: none; }
      .pulse { opacity: 1; transform: none; }
    }
  </style>
  <rect class="bg" x="1" y="1" width="918" height="258" rx="20"/>
  <text class="sub" x="40" y="38">provider-free synthetic path</text>

  <rect class="node" x="40" y="82" width="180" height="96" rx="14"/>
  <text class="label" x="130" y="120" text-anchor="middle">DOCUMENT</text>
  <text class="sub" x="130" y="146" text-anchor="middle">synthetic page</text>

  <path class="wire" d="M220 130 H350"/>
  <circle class="pulse" cx="285" cy="130" r="6"/>

  <rect class="node" x="350" y="82" width="220" height="96" rx="14"/>
  <text class="label" x="460" y="116" text-anchor="middle">PROVENANCE</text>
  <text class="sub" x="460" y="140" text-anchor="middle">tag → split → retain page</text>
  <text class="sub" x="460" y="160" text-anchor="middle">bounded deterministic score</text>

  <path class="wire" d="M570 130 H700"/>
  <circle class="pulse" cx="635" cy="130" r="6" style="animation-delay:.35s"/>

  <rect class="citation" x="700" y="82" width="180" height="96" rx="14"/>
  <text class="label" x="790" y="116" text-anchor="middle">CITATION</text>
  <text class="citation-text" x="790" y="146" text-anchor="middle">[NG28, p.7]</text>
  <text class="sub" x="790" y="166" text-anchor="middle">≤ 3 passages</text>

  <text class="sub" x="460" y="222" text-anchor="middle">synthetic evidence ≠ clinical validation</text>
</svg>
